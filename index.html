<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스테비아 토마토 거래 분석 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: #2c3e50;
      font-size: 1.8em;
      margin: 0 0 8px 0;
    }
    .subtitle {
      color: #7f8c8d;
      font-size: 0.95em;
    }
    .section {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 0.9em;
      color: #95a5a6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #2c3e50;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4em;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .icon-blue { background: #e3f2fd; }
    .icon-green { background: #e8f5e9; }
    .icon-orange { background: #fff3e0; }
    .icon-purple { background: #f3e5f5; }
    .card-content h3 {
      margin: 0 0 4px 0;
      font-size: 1em;
      font-weight: 600;
    }
    .card-content p {
      margin: 0;
      font-size: 0.85em;
      color: #95a5a6;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #95a5a6;
      font-size: 0.85em;
    }
    @media (max-width: 600px) {
      body { padding: 16px; }
      h1 { font-size: 1.5em; }
      .card { padding: 14px 16px; }
      .card-icon { width: 40px; height: 40px; font-size: 1.2em; }
    }
  </style>
</head>
<body>
  <div class="container">

    </header>

    <div class="section">
      <div class="section-title">전체 추이</div>

      <a href="monthly_trend_interactive_confirmed.html" class="card">
        <div class="card-icon icon-blue">📊</div>
        <div class="card-content">
          <h3>월별 주문건수</h3>
          <p>월별 주문 추이와 연도별 요약</p>
        </div>
      </a>

      <a href="daily_trend_interactive_confirmed.html" class="card">
        <div class="card-icon icon-green">📈</div>

          <p>일자별 주문량 변화</p>
        </div>
      </a>
    </div>

    <div class="section">
      <div class="section-title">중도매인 분석</div>

      <a href="merchant_monthly_heatmap_confirmed.html" class="card">
        <div class="card-icon icon-orange">🔥</div>

          <h3>중도매인별 월별 히트맵</h3>
          <p>거래처별 월간 활동 밀도</p>
        </div>
      </a>

      <a href="merchant_monthly_line_confirmed.html" class="card">
        <div class="card-icon icon-purple">📉</div>
        <div class="card-content">
          <h3>중도매인별 월별 추이</h3>
          <p>개별 거래처 주문 변화</p>

      </a>

      <a href="pivot_month_merchant.html" class="card">
        <div class="card-icon icon-blue">📋</div>
        <div class="card-content">
          <h3>월별-중도매인별 표</h3>
          <p>상세 데이터 테이블</p>
        </div>
      </a>
    </div>

    <div class="section">
      <div class="section-title">최근 월 분석</div>

      <a href="may_merchant_bar_confirmed.html" class="card">
        <div class="card-icon icon-green">📊</div>
        <div class="card-content">
          <h3>2025년 5월 중도매인별 주문</h3>
          <p>최근 월 거래처별 현황</p>
        </div>
      </a>
    </div>

    <footer>
      <p>확정상태 + 운송 데이터 기준</p>
    </footer>
  </div>
</body>
</html>
